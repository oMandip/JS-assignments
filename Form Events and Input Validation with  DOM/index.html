<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Events & Input Validation with DOM</title>
</head>

<body>

    <form id="submitForm">
        <input type="text" name="name" placeholder="Enter your name">
        <button type="submit">Submit</button>
    </form>

    <p id="submitMessage"></p>




    <form id="preventForm">
        <input type="text" name="name" placeholder="Enter your name">
        <button type="submit">Submit</button>
    </form>

    <br>

    <input id="liveInput" type="text" placeholder="Type something">

    <p id="liveOutput"></p>


    <br>


    <select id="languageSelect">
        <option value="">Select a language</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
    </select>

    <p id="languageOutput"></p>

    <br>


    <input id="focusInput" type="text" placeholder="Click inside me">


    <br>
    <br>



    <input id="blurInput" type="text" placeholder="Click and then leave">

    <p id="blurMessage"></p>



    <br>



    <form id="nameForm">
        <input id="nameInput" type="text" placeholder="Enter your name">

        <button type="submit">Submit</button>
    </form>

    <p id="nameError"></p>



    <br>



    <form id="emailForm">
        <input id="emailInput" type="email" placeholder="Enter your email">

        <button type="submit">Submit</button>
    </form>

    <p id="emailError"></p>



    <br>




    <form id="passwordForm">
        <input id="passwordInput" type="password" placeholder="Enter password">

        <button type="submit">Submit</button>
    </form>

    <p id="passwordError"></p>



    <br>



    <form id="registrationForm">

    <input
        id="registrationName"
        type="text"
        placeholder="Name"
    >

    <input
        id="registrationEmail"
        type="email"
        placeholder="Email"
    >

    <input
        id="registrationPassword"
        type="password"
        placeholder="Password"
    >

    <button type="submit">Register</button>
</form>

<p id="registrationError"></p>


    <script src="index.js"></script>
</body>

</html>
